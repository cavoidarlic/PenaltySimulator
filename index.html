<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty Kick Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* Live TV Broadcast Scoreboard */
        .tv-scoreboard {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 20, 30, 0.95);
            color: white;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 320px;
            border: 2px solid #2a3143;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .team-row {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #2a3143;
            height: 40px;
        }

        .team-row:last-child {
            border-bottom: none;
        }

        .team-color {
            width: 6px;
            height: 100%;
            border-radius: 3px;
            margin-right: 12px;
        }

        .color-a { background: #007bff; }
        .color-b { background: #dc3545; }

        .team-name {
            flex: 0 0 60px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .team-score {
            font-size: 24px;
            font-weight: bold;
            margin: 0 15px;
            width: 20px;
            text-align: center;
        }

        .penalty-history {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 1; /* Expand naturally to avoid squishing */
            justify-content: flex-end;
            flex-wrap: wrap; /* Wrap dots if the shootout goes very long */
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3a4153;
            border: 2px solid #1a202c;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .dot.goal {
            background: #28a745;
            box-shadow: 0 0 8px #28a745;
            border-color: #1e7e34;
        }

        .dot.miss {
            background: #dc3545;
            box-shadow: 0 0 8px #dc3545;
            border-color: #bd2130;
        }

        .tv-status {
            background: #1a202c;
            text-align: center;
            font-size: 13px;
            padding: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a0aec0;
            font-weight: bold;
        }

        /* In-Goal Transparent Controls */
        .in-goal-overlay {
            position: absolute;
            z-index: 20;
            pointer-events: none; /* Let empty space clicks pass through */
        }
        
        .instruction-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: -45px;
            color: white;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            pointer-events: none;
            letter-spacing: 2px;
            display: none;
        }

        .target-grid {
            width: 100%;
            height: 100%;
            display: none; /* toggled via JS */
            pointer-events: auto;
        }

        .kicker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .keeper-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .target-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .target-zone:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Kicker Target Circles */
        .target-circle {
            width: 50px;
            height: 50px;
            border: 4px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .target-zone:hover .target-circle {
            transform: scale(1.2);
            border-color: #4CAF50;
            border-style: solid;
            background: rgba(76, 175, 80, 0.4);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
        }

        /* Keeper Target Zones */
        .keeper-zone {
            flex-direction: column;
            color: rgba(255, 255, 255, 0.6);
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        .keeper-zone:hover {
            color: #fff;
            background: rgba(33, 150, 243, 0.25);
            border-color: rgba(33, 150, 243, 0.5);
        }

        .dir-icon {
            font-size: 40px;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }

        .keeper-zone:hover .dir-icon {
            transform: scale(1.2);
        }

        /* Game Over Panel (Centered) */
        #game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
            z-index: 30;
            display: none;
            min-width: 300px;
        }

        #game-over-panel h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #game-over-panel p {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #475569;
        }
        
        .action-btn.primary {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #2563eb;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            transition: all 0.2s ease;
            width: 100%;
        }
        
        .action-btn.primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* On Screen Message Overlay */
        #result-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: white;
            text-shadow: 0 5px 20px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 15;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Skin Buttons & System */
        .skin-button, .gk-skin-button {
            position: absolute;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border: 2px solid #444;
            transition: transform 0.2s;
        }
        
        .skin-button { top: 20px; }
        .gk-skin-button { top: 80px; }

        .skin-button:hover, .gk-skin-button:hover { transform: scale(1.1); }
        
        .skin-button-icon {
            width: 30px; height: 30px; background-color: #555;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        .gk-skin-button-icon {
            width: 30px; height: 30px; background-color: #d32f2f;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        
        .skin-panel, .gk-skin-panel {
            position: absolute;
            right: 80px;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
        }

        .skin-panel { top: 20px; }
        .gk-skin-panel { top: 80px; }
        
        .skin-panel h3, .gk-skin-panel h3 { margin-top: 0; text-align: center; color: #444; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .skin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .skin-item {
            border: 2px solid #ddd; border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; align-items: center; position: relative; transition: transform 0.2s;
        }
        .skin-item:hover { transform: scale(1.03); }
        .skin-item.active { border-color: #4CAF50; background-color: rgba(76, 175, 80, 0.1); }
        .skin-item.locked { opacity: 0.7; }
        .skin-item.locked::after { content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #ff5722; }
        .skin-preview { width: 100px; height: 100px; object-fit: contain; margin-bottom: 5px; background-color: #f5f5f5; border-radius: 5px; }
        .skin-name { font-weight: bold; text-align: center; margin: 5px 0; font-size: 14px; }
        .skin-requirement { font-size: 12px; color: #666; text-align: center; }
        .close-button { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }
        .close-button:hover { color: #000; }
        .stats-display { margin-bottom: 15px; padding: 10px; background-color: #f5f5f5; border-radius: 5px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Live TV Scoreboard -->
        <div class="tv-scoreboard">
            <div class="tv-status" id="tv-status">Shootout - Round 1</div>
            <div class="team-row">
                <div class="team-color color-a"></div>
                <div class="team-name">YOU</div>
                <div class="team-score" id="score-a">0</div>
                <div class="penalty-history" id="history-a">
                    <!-- Dots injected via JS -->
                </div>
            </div>
            <div class="team-row">
                <div class="team-color color-b"></div>
                <div class="team-name">AI</div>
                <div class="team-score" id="score-b">0</div>
                <div class="penalty-history" id="history-b">
                    <!-- Dots injected via JS -->
                </div>
            </div>
        </div>

        <div id="result-overlay">GOAL!</div>
        
        <!-- In-Goal Transparent Control Panels -->
        <div id="in-goal-controls" class="in-goal-overlay">
            <div id="instruction-text" class="instruction-text">CHOOSE TARGET</div>
            
            <!-- Controls: Player as Kicker -->
            <div id="controls-kicker" class="target-grid kicker-grid">
                <div class="target-zone" onclick="takeKickAction('TL')"><div class="target-circle"></div></div>
                <div class="target-zone" onclick="takeKickAction('TC')"><div class="target-circle"></div></div>
                <div class="target-zone" onclick="takeKickAction('TR')"><div class="target-circle"></div></div>
                <div class="target-zone" onclick="takeKickAction('BL')"><div class="target-circle"></div></div>
                <div class="target-zone" onclick="takeKickAction('BC')"><div class="target-circle"></div></div>
                <div class="target-zone" onclick="takeKickAction('BR')"><div class="target-circle"></div></div>
            </div>

            <!-- Controls: Player as Goalkeeper -->
            <div id="controls-keeper" class="target-grid keeper-grid">
                <div class="target-zone keeper-zone" onclick="takeDiveAction('L')">
                    <span class="dir-icon">⬅</span>
                    <span>DIVE LEFT</span>
                </div>
                <div class="target-zone keeper-zone" onclick="takeDiveAction('C')">
                    <span class="dir-icon">⬇</span>
                    <span>STAY</span>
                </div>
                <div class="target-zone keeper-zone" onclick="takeDiveAction('R')">
                    <span class="dir-icon">➡</span>
                    <span>DIVE RIGHT</span>
                </div>
            </div>
        </div>

        <!-- Controls: Game Over -->
        <div id="game-over-panel">
            <h2 id="go-title">SHOOTOUT OVER</h2>
            <p id="go-desc">You Won!</p>
            <button class="action-btn primary" onclick="restartGame()">Restart Game</button>
        </div>

        <!-- Skin System UI -->
        <div class="skin-button" id="skinButton" title="Player Skins"><div class="skin-button-icon"></div></div>
        <div class="gk-skin-button" id="gkSkinButton" title="Goalkeeper Skins"><div class="gk-skin-button-icon"></div></div>
        
        <div class="skin-panel" id="skinPanel">
            <button class="close-button" id="closeSkinPanel">×</button>
            <h3>Player Skins</h3>
            <div class="stats-display">Total Goals: <span id="totalGoals">0</span></div>
            <div class="skin-grid" id="skinGrid"></div>
        </div>
        
        <div class="gk-skin-panel" id="gkSkinPanel">
            <button class="close-button" id="closeGkSkinPanel">×</button>
            <h3>Goalkeeper Skins</h3>
            <div class="stats-display">Total Saves: <span id="totalSavesGk">0</span></div>
            <div class="skin-grid" id="gkSkinGrid"></div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let scaleX = 1, scaleY = 1;
        let baseWidth = 800, baseHeight = 600;
        
        // Game State Variables
        let gameState = 'INIT'; // INIT, PLAYER_KICK, PLAYER_DIVE, ANIMATING, RESULT, GAME_OVER
        let currentRound = 1;
        let kicksA = 0; // Player kicks taken
        let kicksB = 0; // AI kicks taken
        let scoreA = 0;
        let scoreB = 0;
        let historyA = []; // Array of 'goal', 'miss', 'save'
        let historyB = [];
        let isSuddenDeath = false;

        // Animation Variables
        let animProgress = 0;
        let ballStart = {x: 0, y: 0}, ballTarget = {x: 0, y: 0};
        let keeperStart = {x: 0, y: 0}, keeperTarget = {x: 0, y: 0};
        let keeperRotation = 0, keeperTargetRot = 0;
        let kickResult = ''; // 'goal', 'miss', 'save'
        let resultMessageText = '';
        let ballDeflectStart = {x: 0, y: 0};
        let ballDeflectTarget = {x: 0, y: 0};

        const sprites = {
            ball: { baseX: 382.5, baseY: 480, baseWidth: 35, baseHeight: 48, x: 0, y: 0, width: 0, height: 0, image: 'theball' },
            goal: { baseX: 200, baseY: 80, baseWidth: 400, baseHeight: 199, x: 0, y: 0, width: 0, height: 0, image: 'thegoal' },
            keeper: { baseX: 300, baseY: 130, baseWidth: 200, baseHeight: 200, x: 0, y: 0, width: 0, height: 0, image: 'thekeeper' },
            kicker: { baseX: 250, baseY: 380, baseWidth: 150, baseHeight: 387, x: 0, y: 0, width: 0, height: 0, image: 'thekicker' }
        };
        
        let ball = { ...sprites.ball };
        let keeper = { ...sprites.keeper };
        let kicker = { ...sprites.kicker };

        // Skin System Data
        let playerStats = { totalGoals: 0, totalSaves: 0, currentSkin: 'default', currentGkSkin: 'default' };
        const images = {};
        const imageNames = ['theball', 'thegoal', 'thekeeper', 'thekicker'];
        let imagesLoaded = 0;

        const skins = [
            { id: 'default', name: 'Kylian Mbappé', file: 'thekicker.png', requirement: 0 },
            { id: 'ronaldo', name: 'Cristiano Ronaldo', file: 'Skin/Ronaldo.png', requirement: 0 },
            { id: 'yamal', name: 'Lamine Yamal', file: 'Skin/yamal.png', requirement: 0 },
            { id: 'haaland', name: 'Erling Haaland', file: 'Skin/Erling Haaland.png', requirement: 5 },
            { id: 'salah', name: 'Mohamed Salah', file: 'Skin/mohamed salah.png', requirement: 10 },
            { id: 'messi', name: 'Lionel Messi', file: 'Skin/Lionel Messi.png', requirement: 35 }
        ];

        const gkSkins = [
            { id: 'default', name: 'Andre Onana', file: 'thekeeper.png', requirement: 0 },
            { id: 'allisson', name: 'Allisson', file: 'GKSkin/Allisson.png', requirement: 0 },
            { id: 'courtouis', name: 'Thibaut Courtois', file: 'GKSkin/Courtouis.png', requirement: 3 },
            { id: 'neuer', name: 'Manuel Neuer', file: 'GKSkin/Manuel Neur.png', requirement: 12 },
            { id: 'szczesny', name: 'Wojciech Szczęsny', file: 'GKSkin/Szczesny.png', requirement: 15 }
        ];

        // Core Initialization
        function loadImages() {
            imageNames.forEach(name => {
                images[name] = new Image();
                images[name].onload = () => {
                    imagesLoaded++;
                    if (imagesLoaded === imageNames.length) initGameEngine();
                };
                images[name].src = `${name}.png`;
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scaleX = canvas.width / baseWidth;
            scaleY = canvas.height / baseHeight;
            resetPositions();
        }

        function updateControlOverlayPosition() {
            const controls = document.getElementById('in-goal-controls');
            if (controls) {
                // Add minor padding so targets fit cleanly inside the goal posts
                const paddingX = 15 * scaleX;
                const paddingTop = 15 * scaleY;
                
                controls.style.left = (sprites.goal.x + paddingX) + 'px';
                controls.style.top = (sprites.goal.y + paddingTop) + 'px';
                controls.style.width = (sprites.goal.width - paddingX * 2) + 'px';
                controls.style.height = (sprites.goal.height - paddingTop) + 'px';
            }
        }

        function resetPositions() {
            Object.keys(sprites).forEach(key => {
                sprites[key].x = sprites[key].baseX * scaleX;
                sprites[key].y = sprites[key].baseY * scaleY;
                sprites[key].width = sprites[key].baseWidth * scaleX;
                sprites[key].height = sprites[key].baseHeight * scaleY;
            });
            ball = { ...sprites.ball };
            keeper = { ...sprites.keeper };
            kicker = { ...sprites.kicker };
            keeperRotation = 0;
            updateControlOverlayPosition();
        }

        // Math & Tweening
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // Gameplay Logic
        function updateScoreboardUI() {
            document.getElementById('score-a').textContent = scoreA;
            document.getElementById('score-b').textContent = scoreB;
            
            let statusText = isSuddenDeath ? `Sudden Death - Round ${currentRound}` : `Shootout - Round ${currentRound}`;
            document.getElementById('tv-status').textContent = statusText;

            const renderDots = (historyArray, elementId, kicksTaken) => {
                const container = document.getElementById(elementId);
                container.innerHTML = '';
                
                // Determine how many dots to show. Base 5, extend if sudden death
                let displayCount = isSuddenDeath ? historyArray.length + 1 : 5;
                
                for(let i=0; i<displayCount; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    if (i < historyArray.length) {
                        if (historyArray[i] === 'goal') dot.classList.add('goal');
                        else dot.classList.add('miss'); // red for both miss and save
                    }
                    container.appendChild(dot);
                }
            };

            renderDots(historyA, 'history-a', kicksA);
            renderDots(historyB, 'history-b', kicksB);
        }

        function hideAllPanels() {
            document.getElementById('controls-kicker').style.display = 'none';
            document.getElementById('controls-keeper').style.display = 'none';
            document.getElementById('game-over-panel').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
        }

        function startRoundFlow() {
            resetPositions();
            animProgress = 0;
            hideAllPanels();
            updateScoreboardUI();

            // Alternate turns: Player Kicks -> AI Kicks
            if (kicksA === kicksB) {
                gameState = 'PLAYER_KICK';
                document.getElementById('controls-kicker').style.display = 'grid';
                document.getElementById('instruction-text').textContent = 'CHOOSE TARGET';
                document.getElementById('instruction-text').style.display = 'block';
            } else {
                gameState = 'PLAYER_DIVE';
                document.getElementById('controls-keeper').style.display = 'grid';
                document.getElementById('instruction-text').textContent = 'CHOOSE DIVE';
                document.getElementById('instruction-text').style.display = 'block';
            }
        }

        function takeKickAction(zone) {
            hideAllPanels();
            const aiDiveOptions = ['L', 'C', 'R'];
            const aiDive = aiDiveOptions[Math.floor(Math.random() * 3)];
            resolveShootoutAction(zone, aiDive, true);
        }

        function takeDiveAction(diveZone) {
            hideAllPanels();
            const aiKickOptions = ['TL', 'TC', 'TR', 'BL', 'BC', 'BR'];
            const aiKick = aiKickOptions[Math.floor(Math.random() * 6)];
            resolveShootoutAction(aiKick, diveZone, false);
        }

        function resolveShootoutAction(kickZone, diveZone, isPlayerKicking) {
            const isMiss = Math.random() < 0.08; // 8% chance to just miss entirely
            
            if (isMiss) {
                kickResult = 'miss';
                resultMessageText = "MISSED!";
            } else {
                // Determine if save
                let kickDir = kickZone.includes('L') ? 'L' : (kickZone.includes('R') ? 'R' : 'C');
                if (kickDir === diveZone) {
                    kickResult = 'save';
                    resultMessageText = "SAVED!";
                } else {
                    kickResult = 'goal';
                    resultMessageText = "GOAL!";
                }
            }

            setupAnimationTargets(kickZone, diveZone, isMiss);
            gameState = 'ANIMATING';
        }

        function setupAnimationTargets(kickZone, diveZone, isMiss) {
            ballStart = { x: ball.x, y: ball.y };
            keeperStart = { x: keeper.x, y: keeper.y };
            
            // Goal Base Info
            const gbCenterX = sprites.goal.baseX + sprites.goal.baseWidth / 2;
            const gbY = sprites.goal.baseY;

            // Ball Target Math (Base coords, then scaled)
            let btx = gbCenterX;
            let bty = gbY + 80;

            if (kickZone.includes('L')) btx = gbCenterX - 140;
            if (kickZone.includes('R')) btx = gbCenterX + 140;
            if (kickZone.includes('T')) bty = gbY + 30;
            if (kickZone.includes('B')) bty = gbY + 130;

            if (isMiss) {
                if (kickZone.includes('T')) bty = gbY - 40; // Over
                if (kickZone.includes('L')) btx = sprites.goal.baseX - 40; // Wide Left
                if (kickZone.includes('R')) btx = sprites.goal.baseX + sprites.goal.baseWidth + 40; // Wide Right
            }

            ballTarget = { x: btx * scaleX, y: bty * scaleY };

            // Keeper Target Math
            let ktx = gbCenterX - (sprites.keeper.baseWidth/2);
            let kty = gbY + 50;
            keeperTargetRot = 0;
            
            const isTopKick = kickZone.includes('T');

            if (diveZone === 'L') {
                ktx -= 140;
                if (isTopKick) {
                    kty -= 25; // Jump up for top corner
                    keeperTargetRot = -Math.PI / 6;
                } else {
                    kty += 60; // Dive low for bottom corner
                    keeperTargetRot = -Math.PI / 2;
                }
            } else if (diveZone === 'R') {
                ktx += 140;
                if (isTopKick) {
                    kty -= 25; // Jump up for top corner
                    keeperTargetRot = Math.PI / 6;
                } else {
                    kty += 60; // Dive low for bottom corner
                    keeperTargetRot = Math.PI / 2;
                }
            } else {
                // Stay Center
                if (isTopKick) {
                    kty -= 40; // Leap straight up
                } else {
                    kty += 30; // Squat low
                }
            }

            keeperTarget = { x: ktx * scaleX, y: kty * scaleY };
            
            // Arc logic for ball to give illusion of height
            ballStart.dist = Math.abs(ballTarget.y - ballStart.y);

            // Save Deflection Math
            if (kickResult === 'save') {
                // Intercept point before it hits the back of the net
                ballDeflectStart = {
                    x: lerp(ballStart.x, ballTarget.x, 0.75),
                    y: lerp(ballStart.y, ballTarget.y, 0.75)
                };
                
                // Fling the ball randomly back out onto the pitch
                let flingX = (Math.random() > 0.5 ? 1 : -1) * (150 + Math.random() * 150);
                let flingY = 200 + Math.random() * 150; 
                ballDeflectTarget = {
                    x: ballDeflectStart.x + flingX * scaleX,
                    y: ballDeflectStart.y + flingY * scaleY
                };
            }
        }

        function processResult() {
            const isPlayerKicking = kicksA === kicksB; // If equal, Player just kicked

            if (isPlayerKicking) {
                kicksA++;
                historyA.push(kickResult);
                if (kickResult === 'goal') {
                    scoreA++;
                    playerStats.totalGoals++;
                }
            } else {
                kicksB++;
                historyB.push(kickResult);
                if (kickResult === 'goal') {
                    scoreB++;
                } else if (kickResult === 'save') {
                    playerStats.totalSaves++; // Player as GK saved it
                }
            }
            
            savePlayerStats();
            updateScoreboardUI();

            const winState = checkWinCondition();
            if (winState) {
                gameState = 'GAME_OVER';
                const goPanel = document.getElementById('game-over-panel');
                const goDesc = document.getElementById('go-desc');
                goDesc.textContent = winState === 'A' ? "🏆 You Won the Shootout! 🏆" : "❌ AI Won the Shootout ❌";
                goDesc.style.color = winState === 'A' ? "#28a745" : "#dc3545";
                goPanel.style.display = 'block';
            } else {
                // If both have kicked, advance round
                if (kicksA === kicksB) {
                    currentRound++;
                    if (currentRound > 5) isSuddenDeath = true;
                }
                setTimeout(startRoundFlow, 500);
            }
        }

        function checkWinCondition() {
            let remainingA = Math.max(5 - kicksA, 0);
            let remainingB = Math.max(5 - kicksB, 0);

            // Early win logic (Base 5 rounds)
            if (!isSuddenDeath) {
                if (scoreA > scoreB + remainingB) return 'A';
                if (scoreB > scoreA + remainingA) return 'B';
            }

            // Sudden Death Logic (must be equal kicks taken)
            if (kicksA >= 5 && kicksB >= 5 && kicksA === kicksB) {
                if (scoreA > scoreB) return 'A';
                if (scoreB > scoreA) return 'B';
            }

            return null; // Continue
        }

        function restartGame() {
            kicksA = 0; kicksB = 0;
            scoreA = 0; scoreB = 0;
            historyA = []; historyB = [];
            currentRound = 1;
            isSuddenDeath = false;
            startRoundFlow();
        }

        // Drawing & Graphics
        function drawSprite(sprite, rot = 0) {
            const img = images[sprite.image];
            if (img && img.complete) {
                if (rot !== 0) {
                    ctx.save();
                    const cx = sprite.x + sprite.width / 2;
                    const cy = sprite.y + sprite.height / 2;
                    ctx.translate(cx, cy);
                    ctx.rotate(rot);
                    ctx.drawImage(img, -sprite.width / 2, -sprite.height / 2, sprite.width, sprite.height);
                    ctx.restore();
                } else {
                    ctx.drawImage(img, sprite.x, sprite.y, sprite.width, sprite.height);
                }
            } else {
                ctx.fillStyle = sprite.image === 'theball' ? '#FFF' : '#333';
                ctx.fillRect(sprite.x, sprite.y, sprite.width, sprite.height);
            }
        }

        function drawBallShadow() {
            ctx.save();
            const sx = ball.x + ball.width / 2;
            const sy = (ball.groundY !== undefined ? ball.groundY : ball.y) + ball.height;
            const sw = ball.width * 0.8;
            const sh = ball.height * 0.3;
            
            const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, sw / 2);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.ellipse(sx, sy, sw / 2, sh / 2, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            // Pitch
            ctx.fillStyle = '#2E7D32'; // Darker grass
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Penalty Box lines
            const pboxW = 800 * scaleX;
            const pboxH = 180 * scaleY;
            const pboxX = (canvas.width - pboxW) / 2;
            const pboxY = 270 * scaleY;
            
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 4 * Math.min(scaleX, scaleY);
            ctx.strokeRect(pboxX, pboxY, pboxW, pboxH);
            
            // Penalty Spot
            ctx.beginPath();
            ctx.arc(canvas.width/2, sprites.kicker.baseY * scaleY - 20, 5 * scaleX, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fill();

            // Goal
            drawSprite(sprites.goal);
            
            // Shadow
            if (gameState === 'ANIMATING' || gameState === 'PLAYER_KICK' || gameState === 'PLAYER_DIVE') {
                 drawBallShadow();
            }

            // Entities
            drawSprite(keeper, keeperRotation);
            
            // Shrink ball slightly as it gets further away
            let scaleP = animProgress;
            if (kickResult === 'save' && animProgress > 0.75) {
                scaleP = 0.75 - (animProgress - 0.75) * 0.5; // Grow slightly as it deflects back
            }
            const progressScale = (gameState === 'ANIMATING' || gameState === 'RESULT') ? (1 - scaleP * 0.3) : 1;
            
            const tempW = ball.width;
            const tempH = ball.height;
            ball.width *= progressScale;
            ball.height *= progressScale;
            drawSprite(ball);
            ball.width = tempW;
            ball.height = tempH;

            // Only show kicker before kick
            if (gameState === 'PLAYER_KICK' || gameState === 'PLAYER_DIVE') {
                drawSprite(kicker);
            }
        }

        function showResultText(text, colorClass) {
            const overlay = document.getElementById('result-overlay');
            overlay.textContent = text;
            overlay.style.color = kickResult === 'goal' ? '#4CAF50' : '#F44336';
            overlay.style.opacity = 1;
            
            setTimeout(() => {
                overlay.style.opacity = 0;
            }, 1500);
        }

        function gameLoop() {
            if (gameState === 'ANIMATING') {
                animProgress += 0.035; // Animation speed
                if (animProgress >= 1) {
                    animProgress = 1;
                    gameState = 'RESULT';
                    showResultText(resultMessageText);
                    setTimeout(processResult, 2000);
                }

                // Easing out interpolation
                const easeOutQuad = t => t * (2 - t);
                const easedProgress = easeOutQuad(animProgress);

                if (kickResult === 'save') {
                    if (animProgress < 0.75) {
                        // Flying toward the goal
                        let p = animProgress / 0.75;
                        ball.x = lerp(ballStart.x, ballDeflectStart.x, p);
                        const baseY = lerp(ballStart.y, ballDeflectStart.y, p);
                        const arcHeight = 80 * scaleY;
                        ball.y = baseY - Math.sin(p * Math.PI * 0.5) * arcHeight;
                        ball.groundY = baseY;
                    } else {
                        // Flung away from the keeper
                        let p = (animProgress - 0.75) / 0.25;
                        let bounceEase = p * (2 - p); // ease out bounce
                        ball.x = lerp(ballDeflectStart.x, ballDeflectTarget.x, bounceEase);
                        const baseDeflectY = lerp(ballDeflectStart.y, ballDeflectTarget.y, bounceEase);
                        const deflectArc = 60 * scaleY;
                        ball.y = baseDeflectY - Math.sin(p * Math.PI) * deflectArc;
                        ball.groundY = baseDeflectY;
                    }
                } else {
                    ball.x = lerp(ballStart.x, ballTarget.x, animProgress); // linear x
                    
                    // Add an arc to the ball Y
                    const baseY = lerp(ballStart.y, ballTarget.y, animProgress);
                    const arcHeight = 80 * scaleY;
                    ball.y = baseY - Math.sin(animProgress * Math.PI) * arcHeight;
                    ball.groundY = baseY;
                }

                keeper.x = lerp(keeperStart.x, keeperTarget.x, easedProgress);
                keeper.y = lerp(keeperStart.y, keeperTarget.y, easedProgress);
                keeperRotation = lerp(0, keeperTargetRot, easedProgress);
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // Data Storage & Skins
        function loadPlayerStats() {
            const saved = localStorage.getItem('penaltyStatsV2');
            if (saved) {
                try { playerStats = JSON.parse(saved); } catch (e) { }
            }
            document.getElementById('totalGoals').textContent = playerStats.totalGoals;
            document.getElementById('totalSavesGk').textContent = playerStats.totalSaves;
        }

        function savePlayerStats() {
            localStorage.setItem('penaltyStatsV2', JSON.stringify(playerStats));
            document.getElementById('totalGoals').textContent = playerStats.totalGoals;
            document.getElementById('totalSavesGk').textContent = playerStats.totalSaves;
        }

        function populateSkins() {
            const renderGrid = (gridId, data, currentId, selectFn) => {
                const grid = document.getElementById(gridId);
                grid.innerHTML = '';
                const compareStat = gridId === 'skinGrid' ? playerStats.totalGoals : playerStats.totalSaves;

                data.forEach(skin => {
                    const isUnlocked = compareStat >= skin.requirement;
                    const isActive = currentId === skin.id;
                    
                    const item = document.createElement('div');
                    item.className = `skin-item ${isUnlocked ? '' : 'locked'} ${isActive ? 'active' : ''}`;
                    
                    item.innerHTML = `
                        <img class="skin-preview" src="${skin.file}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23ccc\\'/><text x=\\'50\\' y=\\'50\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\'>N/A</text></svg>'">
                        <div class="skin-name">${skin.name}</div>
                        <div class="skin-requirement">Req: ${skin.requirement}</div>
                    `;
                    
                    if (isUnlocked) {
                        item.onclick = () => selectFn(skin.id);
                    }
                    grid.appendChild(item);
                });
            }

            renderGrid('skinGrid', skins, playerStats.currentSkin, (id) => {
                playerStats.currentSkin = id;
                const file = skins.find(s => s.id === id).file;
                images.thekicker.src = file;
                savePlayerStats();
                populateSkins();
            });

            renderGrid('gkSkinGrid', gkSkins, playerStats.currentGkSkin, (id) => {
                playerStats.currentGkSkin = id;
                const file = gkSkins.find(s => s.id === id).file;
                images.thekeeper.src = file;
                savePlayerStats();
                populateSkins();
            });
        }

        function setupSkinsUI() {
            const togglePanel = (btnId, panelId) => {
                document.getElementById(btnId).onclick = () => {
                    const panel = document.getElementById(panelId);
                    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
                    populateSkins();
                };
            };
            togglePanel('skinButton', 'skinPanel');
            togglePanel('gkSkinButton', 'gkSkinPanel');
            
            document.getElementById('closeSkinPanel').onclick = () => document.getElementById('skinPanel').style.display = 'none';
            document.getElementById('closeGkSkinPanel').onclick = () => document.getElementById('gkSkinPanel').style.display = 'none';
        }

        function applyLoadedSkins() {
            if (playerStats.currentSkin !== 'default') {
                const s = skins.find(x => x.id === playerStats.currentSkin);
                if (s) images.thekicker.src = s.file;
            }
            if (playerStats.currentGkSkin !== 'default') {
                const s = gkSkins.find(x => x.id === playerStats.currentGkSkin);
                if (s) images.thekeeper.src = s.file;
            }
        }

        function initGameEngine() {
            loadPlayerStats();
            applyLoadedSkins();
            setupSkinsUI();
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            startRoundFlow();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('DOMContentLoaded', loadImages);
    </script>
